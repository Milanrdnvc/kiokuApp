<div class="container mt-4" style="max-width: 400px">
  <h2>Register</h2>

  @if (errMsg) {
    <div class="alert alert-danger py-2" role="alert">
      {{ errMsg }}
    </div>
  }

  <form (ngSubmit)="register()" #regForm="ngForm">
    <div class="mb-3">
      <label for="username" class="form-label">Username</label>
      <input
        type="text"
        id="username"
        name="username"
        class="form-control"
        [(ngModel)]="newUser.username"
      />
    </div>

    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input
        type="email"
        id="email"
        name="email"
        class="form-control"
        [(ngModel)]="newUser.email"
      />
    </div>

    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input
        type="password"
        id="password"
        name="password"
        class="form-control"
        [(ngModel)]="newUser.password"
      />
    </div>

    <button type="submit" class="btn btn-primary w-100" [disabled]="!regForm.form.valid">
      Register
    </button>
  </form>

  <p class="mt-3 text-center">Already have an account? <a routerLink="/login">Login</a></p>
</div>
