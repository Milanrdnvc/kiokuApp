<h2>My Decks</h2>
<button (click)="createNewDeck()">Create New Deck</button>

<ul>
  @for (deck of deckList; track deck._id) {
    <li>
      <span>{{ deck.deckId.name }}</span>
      <button (click)="studyDeck(deck)">Study Deck</button>
      <button (click)="manageCards(deck)">Manage Cards</button>
      <button (click)="deckSettings(deck)">Deck Settings</button>
    </li>
  }
</ul>
